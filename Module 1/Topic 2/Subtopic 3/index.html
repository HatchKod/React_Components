<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problem Card Builder - HatchKod</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #fdf6ec; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel via CDN - fine for standalone/Netlify deploy -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const STEPS = [
      {
        id: 1,
        question: "What is the business called, and what kind of business is it?",
        placeholder:
          "e.g. Sai Krishna Tiffin Center - a small breakfast and tiffin shop near the college gate",
        type: "text",
      },
      {
        id: 2,
        question:
          "What did you see them doing manually - the thing that gave you the idea?",
        placeholder:
          "e.g. The owner writes down every order on small paper chits and keeps them in a box near the till",
        type: "textarea",
      },
      {
        id: 3,
        question:
          "What problem does this manual way cause? What did they tell you, or what did you notice?",
        placeholder:
          "e.g. Sometimes chits get lost, orders get mixed up during rush hour, and at the end of the day he can't tell how much he actually sold",
        type: "textarea",
      },
      {
        id: 4,
        question:
          "When you asked if an app would help - what did they say? What do you think would actually help them?",
        placeholder:
          "e.g. He said it would be great if there was a simple way to take orders on a phone or tablet so nothing gets lost, and he can see what sold at the end of the day",
        type: "textarea",
      },
      {
        id: 5,
        question: "Now - in ONE sentence, describe what you are going to build for them.",
        placeholder:
          "e.g. An app where the tiffin center can take and track orders digitally so nothing gets lost and they can see daily sales",
        type: "textarea",
      },
    ];

    const SECTION_LABELS = [
      "Business",
      "What they currently do",
      "The problem this causes",
      "What would help",
    ];

    function ProblemCardBuilder() {
      const params     = new URLSearchParams(window.location.search);
      const subtopicId = params.get("subtopicId");
      const taskId     = params.get("taskId");

      const [currentStep, setCurrentStep] = useState(1);
      const [answers, setAnswers] = useState({ 1: "", 2: "", 3: "", 4: "", 5: "" });
      const [view, setView] = useState("builder");
      const [opacity, setOpacity] = useState(1);
      const [revealNote, setRevealNote] = useState(false);
      const [noteOpacity, setNoteOpacity] = useState(0);
      const [submitted, setSubmitted] = useState(false);

      useEffect(() => {
        if (view === "review") {
          const t1 = setTimeout(() => {
            setRevealNote(true);
            setTimeout(() => setNoteOpacity(1), 50);
          }, 800);
          return () => clearTimeout(t1);
        }
      }, [view]);

      function wordCount(text) {
        return text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
      }

      function fade(callback) {
        setOpacity(0);
        setTimeout(() => {
          callback();
          setOpacity(1);
        }, 220);
      }

      function goToStep(step) {
        fade(() => setCurrentStep(step));
      }

      function handleNext() {
        if (currentStep < 5) {
          goToStep(currentStep + 1);
        } else {
          fade(() => setView("review"));
        }
      }

      function handleEdit(step) {
        fade(() => {
          setCurrentStep(step);
          setView("builder");
        });
      }

      function handleSubmit() {
        fade(() => { setView("submitted"); setSubmitted(true); });
      }

      // Report completion to the LMS - fires exactly once when submitted flips true.
      useEffect(() => {
        if (!submitted) return;
        try {
          window.parent.postMessage({
            type: "HK_RESULT",
            version: "1",
            exerciseId: "m1-t2-s3-problem-card-builder",
            exerciseType: "interactive",
            status: "completed",
            score: 3,
            maxScore: 3,
            answers,
            metadata: { subtopicId, taskId },
            completedAt: new Date().toISOString(),
          }, "*");
        } catch (e) {}
      }, [submitted]);

      const s = {
        wrapper: {
          fontFamily: "'Segoe UI', system-ui, -apple-system, sans-serif",
          background: "linear-gradient(135deg, #fdf6ec 0%, #fef9f3 100%)",
          minHeight: "100vh",
          display: "flex",
          justifyContent: "center",
          alignItems: "flex-start",
          padding: "24px 16px 60px",
          boxSizing: "border-box",
        },
        container: {
          width: "100%",
          maxWidth: "620px",
          opacity,
          transition: "opacity 0.22s ease",
        },
        card: {
          background: "#ffffff",
          borderRadius: "20px",
          boxShadow: "0 4px 32px rgba(180,120,40,0.10), 0 1px 4px rgba(0,0,0,0.06)",
          padding: "36px 28px 32px",
        },
        heading: {
          fontSize: "clamp(18px, 5vw, 22px)",
          fontWeight: "700",
          color: "#1a1a1a",
          margin: "0 0 6px",
          lineHeight: "1.3",
        },
        subtext: {
          fontSize: "14px",
          color: "#6b7280",
          margin: "0 0 28px",
          lineHeight: "1.6",
        },
        progressLabel: {
          fontSize: "11px",
          fontWeight: "700",
          color: "#d97706",
          marginBottom: "8px",
          letterSpacing: "1px",
          textTransform: "uppercase",
        },
        progressTrack: {
          height: "5px",
          background: "#f3e8d0",
          borderRadius: "999px",
          overflow: "hidden",
          marginBottom: "28px",
        },
        question: {
          fontSize: "clamp(16px, 4vw, 18px)",
          fontWeight: "600",
          color: "#111827",
          marginBottom: "16px",
          lineHeight: "1.55",
        },
        input: {
          width: "100%",
          borderRadius: "12px",
          border: "2px solid #e5e7eb",
          padding: "13px 15px",
          fontSize: "15px",
          color: "#111827",
          outline: "none",
          boxSizing: "border-box",
          fontFamily: "inherit",
          resize: "vertical",
          transition: "border-color 0.18s",
          display: "block",
        },
        hint: {
          fontSize: "12px",
          color: "#b0b8c5",
          fontStyle: "italic",
          marginTop: "8px",
          lineHeight: "1.5",
        },
        wordCounter: {
          fontSize: "12px",
          color: "#d97706",
          marginTop: "6px",
          fontWeight: "500",
        },
        nextBtn: (disabled) => ({
          marginTop: "24px",
          width: "100%",
          padding: "14px",
          background: disabled
            ? "#e5e7eb"
            : "linear-gradient(135deg, #f59e0b 0%, #d97706 100%)",
          color: disabled ? "#9ca3af" : "#ffffff",
          border: "none",
          borderRadius: "12px",
          fontSize: "16px",
          fontWeight: "600",
          cursor: disabled ? "not-allowed" : "pointer",
          letterSpacing: "0.3px",
        }),
        generateBtn: (disabled) => ({
          marginTop: "28px",
          width: "100%",
          padding: "15px",
          background: disabled
            ? "#e5e7eb"
            : "linear-gradient(135deg, #10b981 0%, #059669 100%)",
          color: disabled ? "#9ca3af" : "#ffffff",
          border: "none",
          borderRadius: "12px",
          fontSize: "16px",
          fontWeight: "700",
          cursor: disabled ? "not-allowed" : "pointer",
          letterSpacing: "0.3px",
        }),
        // Review
        reviewHeading: {
          fontSize: "clamp(20px, 5vw, 24px)",
          fontWeight: "700",
          color: "#1a1a1a",
          margin: "0 0 6px",
        },
        problemCard: {
          background: "#ffffff",
          border: "1.5px solid #e5e7eb",
          borderRadius: "16px",
          boxShadow: "0 2px 20px rgba(0,0,0,0.07)",
          overflow: "hidden",
          marginBottom: "20px",
        },
        cardHeader: {
          background: "#1f2937",
          padding: "20px 24px 16px",
        },
        cardTitle: {
          fontSize: "12px",
          fontWeight: "700",
          color: "#f9fafb",
          letterSpacing: "3px",
          textTransform: "uppercase",
          margin: "0 0 4px",
        },
        cardSubtitle: { fontSize: "12px", color: "#9ca3af", margin: 0 },
        cardBody: { padding: "0 24px 4px" },
        section: (last) => ({
          borderBottom: last ? "none" : "1px solid #f3f4f6",
          padding: "16px 0 12px",
        }),
        sectionLabel: {
          fontSize: "10px",
          fontWeight: "700",
          color: "#9ca3af",
          letterSpacing: "1.5px",
          textTransform: "uppercase",
          marginBottom: "6px",
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
        },
        editLink: {
          fontSize: "11px",
          color: "#d97706",
          fontWeight: "600",
          cursor: "pointer",
          textDecoration: "underline",
          textTransform: "none",
          letterSpacing: 0,
          background: "none",
          border: "none",
          padding: 0,
          fontFamily: "inherit",
        },
        cardValue: {
          fontSize: "14px",
          color: "#1f2937",
          lineHeight: "1.7",
          whiteSpace: "pre-wrap",
          margin: 0,
        },
        statementBox: {
          background: "#fffbeb",
          margin: "4px 24px 24px",
          borderRadius: "12px",
          padding: "18px 20px",
          border: "1.5px solid #fde68a",
        },
        statementLabel: {
          fontSize: "10px",
          fontWeight: "700",
          color: "#b45309",
          letterSpacing: "1.5px",
          textTransform: "uppercase",
          marginBottom: "10px",
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
        },
        statementText: {
          fontSize: "16px",
          color: "#1f2937",
          fontWeight: "600",
          lineHeight: "1.65",
          whiteSpace: "pre-wrap",
          margin: 0,
        },
        revealNote: (no) => ({
          background: "#f0fdf4",
          border: "1px solid #bbf7d0",
          borderRadius: "12px",
          padding: "16px 20px",
          marginBottom: "20px",
          fontSize: "14px",
          color: "#166534",
          lineHeight: "1.7",
          opacity: no,
          transition: "opacity 1.2s ease",
        }),
        submitBtn: {
          width: "100%",
          padding: "16px",
          background: "linear-gradient(135deg, #3b82f6 0%, #2563eb 100%)",
          color: "#ffffff",
          border: "none",
          borderRadius: "12px",
          fontSize: "16px",
          fontWeight: "700",
          cursor: "pointer",
          letterSpacing: "0.3px",
        },
        // Submitted
        submittedCard: {
          background: "#ffffff",
          borderRadius: "20px",
          boxShadow: "0 4px 32px rgba(37,99,235,0.10)",
          padding: "48px 28px 44px",
          textAlign: "center",
        },
        submittedTitle: {
          fontSize: "22px",
          fontWeight: "700",
          color: "#1a1a1a",
          marginBottom: "20px",
        },
        submittedBody: {
          fontSize: "15px",
          color: "#374151",
          lineHeight: "1.8",
          textAlign: "left",
        },
        submittedHighlight: {
          background: "#eff6ff",
          borderRadius: "10px",
          padding: "16px 20px",
          marginTop: "24px",
          fontSize: "15px",
          color: "#1e40af",
          fontWeight: "600",
          lineHeight: "1.6",
        },
      };

      // ── SUBMITTED ──
      if (view === "submitted") {
        return (
          <div style={s.wrapper}>
            <div style={s.container}>
              <div style={s.submittedCard}>
                <div style={{ fontSize: "52px", marginBottom: "16px" }}>🎯</div>
                <div style={s.submittedTitle}>Your Problem Card is submitted.</div>
                <div style={s.submittedBody}>
                  <p style={{ marginTop: 0, marginBottom: "12px" }}>
                    Your mentor will read this and either approve it, or come
                    back with one quick question to help you sharpen it.
                  </p>
                  <p style={{ marginBottom: 0 }}>
                    Either way - you've done the hardest part. You found a real
                    problem, talked to a real person, and wrote it down clearly.
                  </p>
                </div>
                <div style={s.submittedHighlight}>
                  Next - we plan exactly what you'll build.
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ── REVIEW ──
      if (view === "review") {
        return (
          <div style={s.wrapper}>
            <div style={s.container}>
              <h1 style={s.reviewHeading}>Here is your Problem Card 🎉</h1>
              <p style={s.subtext}>
                This is the page your mentor will read. Review it - you can go
                back and edit any answer before submitting.
              </p>

              <div style={s.problemCard}>
                <div style={s.cardHeader}>
                  <div style={s.cardTitle}>Problem Card</div>
                  <div style={s.cardSubtitle}>
                    Friendly Neighbourhood Developer Internship - Module 0
                  </div>
                </div>

                <div style={s.cardBody}>
                  {[0, 1, 2, 3].map((i) => (
                    <div key={i} style={s.section(i === 3)}>
                      <div style={s.sectionLabel}>
                        <span>{SECTION_LABELS[i]}</span>
                        <button
                          style={s.editLink}
                          onClick={() => handleEdit(i + 1)}
                        >
                          Edit
                        </button>
                      </div>
                      <p style={s.cardValue}>{answers[i + 1]}</p>
                    </div>
                  ))}
                </div>

                <div style={s.statementBox}>
                  <div style={s.statementLabel}>
                    <span>Problem Statement</span>
                    <button
                      style={{ ...s.editLink, color: "#b45309" }}
                      onClick={() => handleEdit(5)}
                    >
                      Edit
                    </button>
                  </div>
                  <p style={s.statementText}>{answers[5]}</p>
                </div>
              </div>

              {revealNote && (
                <div style={s.revealNote(noteOpacity)}>
                  This page is called a Problem Statement. Every app ever
                  built - Swiggy, PhonePe, the one you're about to make -
                  started with a page exactly like this. You just wrote yours.
                </div>
              )}

              <button style={s.submitBtn} onClick={handleSubmit}>
                Submit my Problem Card to my mentor →
              </button>
            </div>
          </div>
        );
      }

      // ── BUILDER ──
      const step = STEPS[currentStep - 1];
      const pct = (currentStep / 5) * 100;
      const currentAnswer = answers[currentStep] || "";
      const disabled = currentAnswer.trim() === "";

      return (
        <div style={s.wrapper}>
          <div style={s.container}>
            <div style={s.card}>
              <h1 style={s.heading}>
                Let's turn your conversation into your Problem Card 📋
              </h1>
              <p style={s.subtext}>
                Five short questions. Answer based on what you actually saw and
                heard this week. No need to make it sound fancy - just real.
              </p>

              <div style={s.progressLabel}>Step {currentStep} of 5</div>
              <div style={s.progressTrack}>
                <div
                  style={{
                    height: "100%",
                    width: `${pct}%`,
                    background: "linear-gradient(90deg, #f59e0b, #d97706)",
                    borderRadius: "999px",
                    transition: "width 0.4s cubic-bezier(0.4,0,0.2,1)",
                  }}
                />
              </div>

              <div style={s.question}>{step.question}</div>

              {step.type === "text" ? (
                <input
                  style={s.input}
                  type="text"
                  value={currentAnswer}
                  onChange={(e) =>
                    setAnswers((prev) => ({ ...prev, [currentStep]: e.target.value }))
                  }
                  onFocus={(e) => (e.target.style.borderColor = "#f59e0b")}
                  onBlur={(e) => (e.target.style.borderColor = "#e5e7eb")}
                />
              ) : (
                <textarea
                  style={{ ...s.input, minHeight: "92px" }}
                  value={currentAnswer}
                  onChange={(e) =>
                    setAnswers((prev) => ({ ...prev, [currentStep]: e.target.value }))
                  }
                  onFocus={(e) => (e.target.style.borderColor = "#f59e0b")}
                  onBlur={(e) => (e.target.style.borderColor = "#e5e7eb")}
                />
              )}

              <div style={s.hint}>{step.placeholder}</div>

              {currentStep === 5 && (
                <div style={s.wordCounter}>
                  {wordCount(currentAnswer)} word{wordCount(currentAnswer) !== 1 ? "s" : ""} -
                  Keep it to one or two sentences. Simple is perfect.
                </div>
              )}

              {currentStep < 5 ? (
                <button
                  style={s.nextBtn(disabled)}
                  disabled={disabled}
                  onClick={handleNext}
                >
                  Next →
                </button>
              ) : (
                <button
                  style={s.generateBtn(disabled)}
                  disabled={disabled}
                  onClick={handleNext}
                >
                  Generate my Problem Card →
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<ProblemCardBuilder />);
  </script>
</body>
</html>
