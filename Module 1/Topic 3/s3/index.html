let audioCtx = null;
function playSound(type, muted) {
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'add') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(440, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'remove') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(220, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(659, now + 0.1);
      osc.frequency.setValueAtTime(784, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'submit') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(392, now);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'warn') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(330, now);
      osc.frequency.setValueAtTime(277, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'reveal') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(659, now + 0.1);
      osc.frequency.setValueAtTime(784, now + 0.2);
      osc.frequency.setValueAtTime(1047, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
    } else if (type === 'tick') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    }
  } catch (e) {}
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function countSentences(text) {
  const t = text.trim();
  if (!t) return 0;
  return t.split(/[.!?]+/).filter(s => s.trim().length > 3).length;
}

// ─────────────────────────────────────────────
// CONFETTI
// ─────────────────────────────────────────────
const CONFETTI_COLORS = ['#22c55e','#3B82F6','#F59E0B','#EC4899','#8B5CF6','#14B8A6'];
function Confetti({ show }) {
  if (!show) return null;
  const dots = Array.from({ length: 40 }, (_, i) => ({
    id: i,
    color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
    left: `${Math.random() * 100}%`,
    delay: `${Math.random() * 1.5}s`,
    duration: `${2 + Math.random() * 2}s`,
    size: `${6 + Math.random() * 8}px`,
    rotate: Math.random() > 0.5 ? 'borderRadius:50%' : '',
  }));
  return (
    <div className="dsg-confetti-wrap" aria-hidden="true">
      {dots.map(d => (
        <div key={d.id} className="dsg-confetti-dot" style={{
          background: d.color,
          left: d.left,
          top: '-20px',
          width: d.size,
          height: d.size,
          borderRadius: Math.random() > 0.5 ? '50%' : '2px',
          animationDuration: d.duration,
          animationDelay: d.delay,
        }} />
      ))}
    </div>
  );
}

// ─────────────────────────────────────────────
// STEP CARD
// ─────────────────────────────────────────────
function StepCard({ step, status, isExpanded, onDone, onOpenTrouble, muted }) {
  const [openOption, setOpenOption] = useState(null);
  const [troubleOpen, setTroubleOpen] = useState(false);

  const handleDone = () => {
    playSound('correct', muted);
    onDone(step.id);
  };

  const handleTrouble = () => {
    playSound('warn', muted);
    const next = !troubleOpen;
    setTroubleOpen(next);
    if (next) setOpenOption(null);
    onOpenTrouble && onOpenTrouble(step.id, next);
  };

  const numState = status === 'done' ? 'done' : status === 'active' ? 'active' : 'pending';

  return (
    <div
      className={`dsg-step-card ${status === 'done' ? 'done' : status === 'active' ? 'active' : ''}`}
      id={`step-card-${step.id}`}
    >
      <div className="dsg-step-header">
        <div className={`dsg-step-num ${numState}`}>
          {status === 'done' ? '✓' : step.id}
        </div>
        <div className="dsg-step-title-wrap">
          <div className={`dsg-step-title ${status === 'done' ? 'done-title' : ''}`}>
            {step.title}
          </div>
          {status === 'done' && (
            <div className="dsg-step-done-badge">Done ✓</div>
          )}
        </div>
      </div>

      {isExpanded && (
        <div className="dsg-step-body">
          <div className="dsg-instruction">{step.instruction}</div>

          {step.hasCode && (
            <div className="dsg-code-block">{step.code}</div>
          )}

          <div className="dsg-expected">
            <strong>Expected to see</strong>
            {step.expected}
          </div>

          <div className="dsg-btn-row">
            <button id={`btn-done-${step.id}`} className="dsg-btn-done" onClick={handleDone}>
              ✓ Done — I see this
            </button>
            <button
              id={`btn-trouble-${step.id}`}
              className={`dsg-btn-trouble${troubleOpen ? ' open' : ''}`}
              onClick={handleTrouble}
            >
              ⚠ Something looks different
            </button>
          </div>
        </div>
      )}

      {isExpanded && troubleOpen && (
        <div className="dsg-trouble-panel">
          <h4>What's different? Click to see the fix 👇</h4>
          {step.troubleshooter.map((opt, idx) => (
            <div key={idx} className="dsg-trouble-option">
              <button
                className={`dsg-trouble-option-btn${openOption === idx ? ' open' : ''}`}
                onClick={() => setOpenOption(openOption === idx ? null : idx)}
              >
                <span className="arrow">▶</span>
                {opt.label}
              </button>
              {openOption === idx && (
                <div className="dsg-trouble-fix">{opt.fix}</div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────
// TERMINAL SIMULATOR
// ─────────────────────────────────────────────
function TerminalSimulator({ muted, onSuccess }) {
  const [lines, setLines] = useState([]);
  const [input, setInput] = useState('');
  const [nudge, setNudge] = useState(false);
  const inputRef = useRef(null);

  const handleKey = (e) => {
    if (e.key !== 'Enter') return;
    const cmd = input.trim().toLowerCase().replace(/\s+/g, ' ');
    const typedLine = input;
    setInput('');
    setNudge(false);

    if (cmd === 'java -version') {
      setLines(prev => [
        ...prev,
        { type: 'cmd', text: typedLine },
        { type: 'out', text: 'openjdk version "17.0.9" 2023-10-17' },
        { type: 'out', text: 'OpenJDK Runtime Environment Temurin-17.0.9+9' },
        { type: 'out', text: 'OpenJDK 64-Bit Server VM Temurin-17.0.9+9 (build 17.0.9+9, mixed mode, sharing)' },
      ]);
      setTimeout(() => {
        playSound('correct', muted);
        setTimeout(() => {
          playSound('reveal', muted);
          onSuccess();
        }, 500);
      }, 100);
    } else if (typedLine.trim() !== '') {
      setLines(prev => [
        ...prev,
        { type: 'cmd', text: typedLine },
        { type: 'err', text: `'${typedLine}': command not found` },
      ]);
      setNudge(true);
    }
  };

  useEffect(() => {
    inputRef.current && inputRef.current.focus();
  }, []);

  return (
    <div className="dsg-terminal-wrap" onClick={() => inputRef.current && inputRef.current.focus()}>
      <div className="dsg-terminal-header">
        <div className="dsg-terminal-dot" style={{ background: '#FF5F57' }} />
        <div className="dsg-terminal-dot" style={{ background: '#FFBD2E' }} />
        <div className="dsg-terminal-dot" style={{ background: '#28C840' }} />
        <div className="dsg-terminal-label">Terminal</div>
      </div>
      <div className="dsg-terminal-body">
        {lines.map((line, i) => (
          <div key={i} className="dsg-terminal-line">
            {line.type === 'cmd' && <span className="dsg-terminal-prompt">C:\Users\Ravi&gt;</span>}
            <span style={{ color: line.type === 'err' ? '#FF6B6B' : '#4AF626' }}>
              {line.text}
            </span>
          </div>
        ))}
        <div className="dsg-terminal-input-line">
          <span className="dsg-terminal-prompt">C:\Users\Ravi&gt;</span>
          <input
            ref={inputRef}
            className="dsg-terminal-input"
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={handleKey}
            placeholder="type java -version here"
            autoComplete="off"
            spellCheck="false"
            id="terminal-input"
          />
        </div>
        {nudge && (
          <div className="dsg-terminal-nudge">
            💡 Type exactly: java -version &nbsp;(lowercase, with a hyphen between java and version)
          </div>
        )}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────
// MAIN COMPONENT
// ─────────────────────────────────────────────
function DevSetupGuide() {
  const [muted, setMuted] = useState(false);
  const [stepStatus, setStepStatus] = useState(
    Object.fromEntries(STEPS.map(s => [s.id, 'pending']))
  );
  const [activeStep, setActiveStep] = useState(1);
  const [allDone, setAllDone] = useState(false);
  const [showConfetti, setShowConfetti] = useState(false);
  const [terminalSuccess, setTerminalSuccess] = useState(false);
  const [checkmarks, setCheckmarks] = useState([false, false, false]);
  const [showReveal, setShowReveal] = useState(false);
  const [reflection, setReflection] = useState('');
  const [submitted, setSubmitted] = useState(false);
  const section2Ref = useRef(null);

  useEffect(() => {
    const tag = document.createElement('style');
    tag.textContent = CSS;
    document.head.appendChild(tag);
    return () => document.head.removeChild(tag);
  }, []);

  const completedCount = Object.values(stepStatus).filter(s => s === 'done').length;
  const totalCount = STEPS.length;

  const handleStepDone = (stepId) => {
    const newStatus = { ...stepStatus, [stepId]: 'done' };
    setStepStatus(newStatus);
    const nextStep = STEPS.find(s => s.id === stepId + 1);
    if (nextStep) {
      setActiveStep(nextStep.id);
      newStatus[nextStep.id] = 'active';
      setStepStatus({ ...newStatus, [nextStep.id]: 'active' });
    } else {
      // All done
      setAllDone(true);
      setShowConfetti(true);
      setTimeout(() => setShowConfetti(false), 4000);
    }
  };

  const handleTerminalSuccess = () => {
    // Show checkmarks one by one
    setTimeout(() => {
      setCheckmarks([true, false, false]);
      playSound('tick', muted);
    }, 300);
    setTimeout(() => {
      setCheckmarks([true, true, false]);
      playSound('tick', muted);
    }, 800);
    setTimeout(() => {
      setCheckmarks([true, true, true]);
      playSound('tick', muted);
    }, 1300);
    setTimeout(() => {
      setTerminalSuccess(true);
      setShowReveal(true);
      playSound('reveal', muted);
    }, 1700);
    setTimeout(() => {
      section2Ref.current && section2Ref.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 2000);
  };

  const sentenceCount = countSentences(reflection);
  const canSubmit = sentenceCount >= 2;

  const handleSubmit = () => {
    if (!canSubmit) return;
    playSound('submit', muted);
    setSubmitted(true);
  };

  const getStepState = (stepId) => {
    if (stepStatus[stepId] === 'done') return 'done';
    if (stepId === activeStep) return 'active';
    return 'pending';
  };

  // Group steps by part
  let lastPart = null;

  if (submitted) {
    return (
      <div className="dsg-wrap">
        <Confetti show={true} />
        <div className="dsg-done-card" id="done-card">
          <div style={{ fontSize: '3.5rem', marginBottom: '1rem' }}>🎓</div>
          <h1>Module 0 Complete.</h1>
          <p>You did something most people never do.</p>
          <p>You found a real problem.<br />You talked to a real business owner.<br />You planned a real solution.<br />And you set up a real developer's machine.</p>
          <p>Most students start a coding course by watching videos.</p>
          <p className="highlight">You started by going outside and finding a problem worth solving.</p>
          <p style={{ marginTop: '.75rem' }}>That is the difference.</p>
          <p style={{ fontWeight: 700, color: '#0f172a', fontSize: '1.2rem', marginTop: '1.5rem' }}>
            Module 1 starts now. Let's build. 🚀
          </p>
        </div>
      </div>
    );
  }

  return (
    <div className="dsg-wrap">
      <Confetti show={showConfetti} />

      <button
        id="mute-toggle"
        className="dsg-mute"
        onClick={() => setMuted(m => !m)}
        title={muted ? 'Unmute sounds' : 'Mute sounds'}
        aria-label={muted ? 'Unmute sounds' : 'Mute sounds'}
      >
        {muted ? '🔇' : '🔊'}
      </button>

      {/* ══ HEADER ══ */}
      <div className="dsg-header">
        <h1>Let's get your laptop ready — one step at a time 💻</h1>
        <p>
          Follow each step carefully. Tick it when done.<br />
          If something looks different — hit <strong>"Something looks different"</strong> and we will fix it.
        </p>
      </div>

      {/* ══ PROGRESS BAR ══ */}
      <div className="dsg-progress-wrap">
        <div className="dsg-progress-label">
          <span>Overall progress</span>
          <strong>{completedCount} of {totalCount} steps done</strong>
        </div>
        <div className="dsg-progress-track">
          <div className="dsg-progress-fill" style={{ width: `${(completedCount / totalCount) * 100}%` }} />
        </div>
      </div>

      {/* ══ SECTION 1 — STEP CARDS ══ */}
      {!allDone && STEPS.map(step => {
        const showPartLabel = step.part !== null;
        const partIdx = step.partIndex;
        return (
          <div key={step.id}>
            {showPartLabel && (
              <div
                className="dsg-part-label"
                style={{ background: PART_COLORS[partIdx] }}
                id={`part-label-${partIdx}`}
              >
                <div className="dsg-part-label-dot" />
                {step.part}
              </div>
            )}
            <StepCard
              step={step}
              status={getStepState(step.id)}
              isExpanded={step.id === activeStep && stepStatus[step.id] !== 'done'}
              onDone={handleStepDone}
              muted={muted}
            />
          </div>
        );
      })}

      {/* Completed steps shown condensed */}
      {allDone && STEPS.map(step => {
        const showPartLabel = step.part !== null;
        return (
          <div key={step.id}>
            {showPartLabel && (
              <div
                className="dsg-part-label"
                style={{ background: PART_COLORS[step.partIndex] }}
              >
                <div className="dsg-part-label-dot" />
                {step.part}
              </div>
            )}
            <div className="dsg-step-card done" id={`step-card-${step.id}`}>
              <div className="dsg-step-header">
                <div className="dsg-step-num done">✓</div>
                <div className="dsg-step-title-wrap">
                  <div className="dsg-step-title done-title">{step.title}</div>
                  <div className="dsg-step-done-badge">Done ✓</div>
                </div>
              </div>
            </div>
          </div>
        );
      })}

      {/* ══ SECTION 2 — VERIFICATION MOMENT ══ */}
      {allDone && (
        <div className="dsg-section2" id="section-2">
          <div className="dsg-celebration-text">
            <p>All steps done! 🎉</p>
            <span>One final check...</span>
          </div>

          <TerminalSimulator muted={muted} onSuccess={handleTerminalSuccess} />

          {terminalSuccess && (
            <div className="dsg-success-card" id="success-card">
              <h2>Your laptop is ready. 🚀</h2>
              <p>
                That version number means Java is installed and your laptop can run your code.
              </p>
              <p>
                Every developer checks this exact command on every new machine they set up.
                You just did it for the first time.
              </p>
              <ul className="dsg-check-list" id="checklist-items">
                {[
                  '✅ Java 17 installed and working',
                  '✅ VS Code installed with Java extension',
                  '✅ Git installed and configured',
                ].map((item, i) => (
                  <li key={i} className={checkmarks[i] ? 'visible' : ''}>
                    {item}
                  </li>
                ))}
              </ul>
            </div>
          )}

          {showReveal && (
            <div className="dsg-reveal-card" id="reveal-card" ref={section2Ref}>
              <h2>Your machine is now a developer's machine 💻</h2>
              <p>
                From today — this laptop is not just for downloading notes and watching YouTube.
              </p>
              <p>It is a development machine.</p>
              <p>
                The same setup you just completed — Java, VS Code, Git — is what every Java developer
                has on their laptop in every company in every city in India.
              </p>
              <p>
                <strong>You are now set up exactly like them.</strong>
              </p>
            </div>
          )}

          {showReveal && (
            <div className="dsg-reflection-wrap" id="reflection-wrap">
              <label htmlFor="reflection-input">
                One last thing — how do you feel right now?<br />
                <span style={{ fontWeight: 400, fontSize: '.97rem' }}>
                  Not about the setup. About everything you did in Module 0.
                </span>
              </label>
              <p>
                You found a real business. You talked to a real person. You defined your problem,
                your features, your screens. And now your laptop is ready.
              </p>
              <p style={{ fontStyle: 'italic', color: '#94a3b8', fontSize: '.88rem' }}>
                Write honestly. Nobody grades this. But you will read this again on the last day of the internship.
              </p>
              <textarea
                id="reflection-input"
                className="dsg-textarea"
                placeholder="Honestly right now I feel..."
                value={reflection}
                onChange={e => setReflection(e.target.value)}
                onPaste={e => e.preventDefault()}
                onContextMenu={e => e.preventDefault()}
                rows={5}
              />
              <div id="sentence-counter" className={`dsg-counter${canSubmit ? ' ready' : ''}`}>
                {canSubmit
                  ? `✓ ${sentenceCount} sentences written — ready to submit`
                  : `${sentenceCount} of 2 sentences written`}
              </div>
            </div>
          )}

          {showReveal && (
            <button
              id="submit-btn"
              className="dsg-btn-submit"
              disabled={!canSubmit}
              onClick={handleSubmit}
            >
              I am ready for Module 1 →
            </button>
          )}
        </div>
      )}
    </div>
  );
}
