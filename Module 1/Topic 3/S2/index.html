let audioCtx = null;
function playSound(type, muted) {
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    if (type === 'add') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(440, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'remove') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(220, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(659, now + 0.1);
      osc.frequency.setValueAtTime(784, now + 0.2);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'submit') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(392, now);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.start(now); osc.stop(now + 0.4);
    } else if (type === 'warn') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(330, now);
      osc.frequency.setValueAtTime(277, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    } else if (type === 'reveal') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(659, now + 0.1);
      osc.frequency.setValueAtTime(784, now + 0.2);
      osc.frequency.setValueAtTime(1047, now + 0.3);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      osc.start(now); osc.stop(now + 0.5);
    } else if (type === 'tick') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
      osc.start(now); osc.stop(now + 0.05);
    }
  } catch (e) {}
}

// HELPERS

function uid() { return Math.random().toString(36).slice(2, 9); }
function countSentences(text) {
  const t = text.trim();
  if (!t) return 0;
  return t.split(/[.!?]+/).filter(s => s.trim().length > 3).length;
}

// ─────────────────────────────────────────────
// CANVAS COMPONENT (with full drag + connect)
// ─────────────────────────────────────────────
function CanvasArea({ nodes, arrows, onAddNode, onRemoveNode, onMoveNode, onAddArrow, onRemoveArrow, muted }) {
  const [connectSource, setConnectSource] = useState(null);
  const canvasRef = useRef(null);
  const nodesRef = useRef(nodes);
  nodesRef.current = nodes;

  const handleDragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('dragover'); };
  const handleDragLeave = (e) => { e.currentTarget.classList.remove('dragover'); };
  const handleDrop = (e) => {
    e.preventDefault();
    e.currentTarget.classList.remove('dragover');
    const screenId = e.dataTransfer.getData('screenId');
    if (!screenId) return;
    const rect = canvasRef.current.getBoundingClientRect();
    const x = Math.max(10, Math.min(e.clientX - rect.left - 55, rect.width - 125));
    const y = Math.max(10, Math.min(e.clientY - rect.top - 50, rect.height - 145));
    const domainKey = Object.keys(screenData).find(d => screenData[d].find(s => s.id === screenId));
    if (!domainKey) return;
    const screen = screenData[domainKey].find(s => s.id === screenId);
    onAddNode(screen, x, y);
  };

  const handleNodeMouseDown = (e, nodeId) => {
    if (e.target.classList.contains('afb-screen-node-remove')) return;
    if (connectSource !== null) return; // handled by click
    e.stopPropagation();
    const startX = e.clientX, startY = e.clientY;
    const node = nodesRef.current.find(n => n.id === nodeId);
    const startNX = node.x, startNY = node.y;
    let moved = false;
    const onMove = (ev) => {
      const dx = ev.clientX - startX, dy = ev.clientY - startY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      const rect = canvasRef.current.getBoundingClientRect();
      const nx = Math.max(0, Math.min(startNX + dx, rect.width - 120));
      const ny = Math.max(0, Math.min(startNY + dy, rect.height - 145));
      onMoveNode(nodeId, nx, ny);
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };

  const handleNodeClick = (e, nodeId) => {
    if (e.target.classList.contains('afb-screen-node-remove')) return;
    if (connectSource === null) {
      setConnectSource(nodeId);
    } else if (connectSource === nodeId) {
      setConnectSource(null);
    } else {
      const exists = arrows.some(
        a => (a.from === connectSource && a.to === nodeId) ||
             (a.from === nodeId && a.to === connectSource)
      );
      if (!exists) { onAddArrow(connectSource, nodeId); playSound('tick', muted); }
      setConnectSource(null);
    }
  };

  const getCenter = (node) => ({ x: node.x + 55, y: node.y + 65 });

  const makePath = (n1, n2) => {
    const c1 = getCenter(n1), c2 = getCenter(n2);
    const dx = c2.x - c1.x, dy = c2.y - c1.y;
    const cx = c1.x + dx / 2 + dy * 0.3;
    const cy = c1.y + dy / 2 - dx * 0.3;
    return `M ${c1.x} ${c1.y} Q ${cx} ${cy} ${c2.x} ${c2.y}`;
  };

  const isEmpty = nodes.length === 0;

  return (
    <div ref={canvasRef} className="afb-canvas-wrap" style={{ minHeight: 360 }}
      onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop}>

      {isEmpty && (
        <div className="afb-canvas-empty">
          <span>📲</span>
          <p>Drag screens here to build your flow</p>
        </div>
      )}

      <svg style={{ position:'absolute', inset:0, width:'100%', height:'100%', overflow:'visible', pointerEvents:'none' }}>
        <defs>
          <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 9 3, 0 6" fill="#8B5CF6" />
          </marker>
        </defs>
        {arrows.map(arrow => {
          const n1 = nodes.find(n => n.id === arrow.from);
          const n2 = nodes.find(n => n.id === arrow.to);
          if (!n1 || !n2) return null;
          return (
            <g key={arrow.id} style={{ pointerEvents:'all', cursor:'pointer' }}
              onClick={() => { onRemoveArrow(arrow.id); playSound('remove', muted); }}>
              <path d={makePath(n1, n2)} stroke="#8B5CF6" strokeWidth="2.5" fill="none" markerEnd="url(#arr)" />
              <path d={makePath(n1, n2)} stroke="transparent" strokeWidth="18" fill="none" />
            </g>
          );
        })}
      </svg>

      {nodes.map(node => (
        <div key={node.id}
          className={`afb-screen-node${connectSource === node.id ? ' connecting-source' : ''}${connectSource && connectSource !== node.id ? ' connecting-target' : ''}`}
          style={{ left: node.x, top: node.y }}
          onMouseDown={(e) => handleNodeMouseDown(e, node.id)}
          onClick={(e) => handleNodeClick(e, node.id)}
        >
          <button className="afb-screen-node-remove" onClick={(e) => {
            e.stopPropagation();
            onRemoveNode(node.id);
            if (connectSource === node.id) setConnectSource(null);
          }}>×</button>
          <div className="afb-screen-node-icon">{node.icon}</div>
          <div className="afb-screen-node-name">{node.name}</div>
        </div>
      ))}

      {connectSource && (
        <div style={{
          position:'absolute', bottom:10, left:'50%', transform:'translateX(-50%)',
          background:'rgba(124,58,237,.9)', color:'#fff', borderRadius:999,
          padding:'.35rem 1.1rem', fontSize:'.8rem', fontWeight:600, pointerEvents:'none', whiteSpace:'nowrap',
        }}>
          Now click another screen to connect with an arrow →
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────
// MAIN COMPONENT
// ─────────────────────────────────────────────
function AppFlowBuilder() {
  const [muted, setMuted]         = useState(false);
  const [domain, setDomain]       = useState('');
  const [canvasNodes, setNodes]   = useState([]);
  const [arrows, setArrows]       = useState([]);
  const [warning, setWarning]     = useState('');
  const [flowReady, setFlowReady] = useState(false);
  const [showReveal, setReveal]   = useState(false);
  const [flowText, setFlowText]   = useState('');
  const [submitted, setSubmitted] = useState(false);
  const section2Ref = useRef(null);

  useEffect(() => {
    const tag = document.createElement('style');
    tag.textContent = CSS;
    document.head.appendChild(tag);
    return () => document.head.removeChild(tag);
  }, []);

  const handleDomain = (d) => {
    playSound('tick', muted);
    setDomain(d);
    setNodes([]); setArrows([]); setWarning('');
    setFlowReady(false); setReveal(false);
  };

  const addNodeToCanvas = (screen, x, y) => {
    const alreadyOn = canvasNodes.find(n => n.screenId === screen.id);
    if (alreadyOn) return;
    const count = canvasNodes.length;
    const col = count % 4, row = Math.floor(count / 4);
    setNodes(prev => [...prev, {
      id: uid(), screenId: screen.id, icon: screen.icon, name: screen.name,
      x: x !== undefined ? x : 20 + col * 135,
      y: y !== undefined ? y : 20 + row * 155,
    }]);
  };

  const removeNode = (nodeId) => {
    setNodes(prev => prev.filter(n => n.id !== nodeId));
    setArrows(prev => prev.filter(a => a.from !== nodeId && a.to !== nodeId));
  };

  const moveNode = (nodeId, x, y) => {
    setNodes(prev => prev.map(n => n.id === nodeId ? { ...n, x, y } : n));
  };

  const addArrow = (from, to) => setArrows(prev => [...prev, { id: uid(), from, to }]);
  const removeArrow = (arrowId) => setArrows(prev => prev.filter(a => a.id !== arrowId));

  const handleFlowReady = () => {
    if (canvasNodes.length < 3) { playSound('warn', muted); setWarning('screens'); return; }
    if (arrows.length === 0)    { playSound('warn', muted); setWarning('arrows');  return; }
    setWarning('');
    playSound('correct', muted);
    setFlowReady(true);
    setTimeout(() => { playSound('reveal', muted); setReveal(true); }, 800);
  };

  const scrollToSection2 = () => section2Ref.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });

  const sentenceCount = countSentences(flowText);
  const canSubmit = sentenceCount >= 2;

  const handleSubmit = () => {
    if (!canSubmit) return;
    playSound('submit', muted);
    setSubmitted(true);
  };

  const screens = domain ? screenData[domain] : [];

  return (
    <div className="afb-wrap">
      <button className="afb-mute" id="mute-toggle" onClick={() => setMuted(m => !m)} title={muted ? 'Unmute sounds' : 'Mute sounds'}>
        {muted ? '🔇' : '🔊'}
      </button>

      {/* ══ SECTION 1 ══ */}
      <div className="afb-header">
        <h1>Draw how your app flows — screen by screen 📱</h1>
        <p>Drag the screens your app needs onto the canvas.<br/>Then connect them with arrows to show how a user moves through your app.</p>
      </div>

      {/* Domain pills */}
      <div className="afb-pills" id="domain-selector">
        {[
          { id: 'Gym',       label: '🏋️ Gym' },
          { id: 'Mess',      label: '🍱 Mess' },
          { id: 'Hotel',     label: '🏨 Hotel' },
          { id: 'Chai Shop', label: '☕ Chai Shop' },
          { id: 'Other',     label: '🏪 Other' },
        ].map(d => (
          <button key={d.id} id={`domain-${d.id.replace(' ', '-').toLowerCase()}`}
            className={`afb-pill${domain === d.id ? ' active' : ''}`}
            onClick={() => handleDomain(d.id)}>{d.label}</button>
        ))}
      </div>

      {domain && !submitted && (
        <>
          {/* Screen Library */}
          <div className="afb-section" style={{ animation:'fadeIn .5s ease-out' }}>
            <h2>Screens available for your app</h2>
            <p style={{ marginBottom:'.85rem' }}>Drag the ones you need onto the canvas below · or tap "+ Add" on mobile</p>
            <div className="afb-library-scroll" id="screen-library">
              {screens.map(screen => {
                const used = !!canvasNodes.find(n => n.screenId === screen.id);
                return (
                  <div key={screen.id} id={`lib-${screen.id}`}
                    className={`afb-lib-card${used ? ' used' : ''}`}
                    draggable={!used}
                    onDragStart={e => { e.dataTransfer.setData('screenId', screen.id); e.dataTransfer.effectAllowed = 'copy'; }}
                  >
                    <div className="afb-lib-card-icon">{screen.icon}</div>
                    <div className="afb-lib-card-name">{screen.name}</div>
                    <div className="afb-lib-card-desc">{screen.desc}</div>
                    {!used && (
                      <button id={`add-${screen.id}`} className="afb-lib-card-add"
                        onClick={() => { addNodeToCanvas(screen); playSound('add', muted); }}>+ Add</button>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Canvas */}
          <div className="afb-section" style={{ marginTop:'1.5rem', animation:'fadeIn .6s ease-out' }}>
            <h2>Your app flow</h2>
            <p style={{ marginBottom:'.75rem' }}>Drop screens here · Click a screen then click another to draw an arrow · Click an arrow to remove it</p>

            {canvasNodes.length >= 2 && arrows.length === 0 && (
              <div className="afb-hint">
                <div className="afb-hint-dot" />
                Click a screen, then click another to connect them with an arrow
              </div>
            )}
            {canvasNodes.length >= 1 && arrows.length > 0 && (
              <div className="afb-hint" style={{ color:'#64748b' }}>
                <div className="afb-hint-dot" style={{ background:'#94a3b8', animation:'none' }} />
                Click any arrow to remove it · Click two screens to connect them
              </div>
            )}

            <CanvasArea
              nodes={canvasNodes} arrows={arrows}
              onAddNode={addNodeToCanvas} onRemoveNode={removeNode}
              onMoveNode={moveNode} onAddArrow={addArrow} onRemoveArrow={removeArrow}
              muted={muted}
            />

            {warning === 'screens' && (
              <div className="afb-warn" id="warn-screens">
                ⚠️ <strong>Your app needs at least 3 screens</strong> — one for each of your MVP features. Add a few more!
              </div>
            )}
            {warning === 'arrows' && (
              <div className="afb-warn" id="warn-arrows">
                ⚠️ <strong>Don't forget the arrows!</strong> Connect your screens to show how a user moves through your app.
              </div>
            )}

            {!flowReady && (
              <button id="flow-ready-btn" className="afb-btn afb-btn-primary" style={{ maxWidth:420, margin:'0 auto' }}
                onClick={handleFlowReady}>My flow is ready →</button>
            )}
          </div>

          {/* Flow Summary */}
          {flowReady && (
            <div className="afb-flow-summary" id="flow-summary">
              <p style={{ fontSize:'1.15rem', color:'#0f172a', fontWeight:600, marginBottom:'.5rem' }}>
                Your app has <strong>{canvasNodes.length} screens</strong> connected by <strong>{arrows.length} arrow{arrows.length !== 1 ? 's' : ''}</strong>.
              </p>
              <p>This is the journey a real user will take through your app.</p>
              <p>Before any code — you already know exactly what you are building.</p>
            </div>
          )}

          {/* Reveal Card */}
          {showReveal && (
            <div className="afb-reveal" id="reveal-card">
              <h2>You just made your first Wireframe 🎉</h2>
              <p>Those screen boxes and arrows?<br/>The whole developer world calls them <strong>Wireframes</strong>.</p>
              <p>Wireframes are the first thing every professional builds before any code. Not just beginners. Senior developers. Startup founders. Product teams.</p>
              <p>The people who built <strong>Swiggy</strong> drew wireframes before they wrote a line of code.</p>
              <p style={{ marginBottom:0 }}><strong>You just did the same thing.</strong></p>
              <button id="goto-section2" className="afb-btn afb-btn-amber" onClick={scrollToSection2}>
                Now let's do it on paper →
              </button>
            </div>
          )}
        </>
      )}

      {/* ══ SECTION 2 ══ */}
      {domain && showReveal && !submitted && (
        <div ref={section2Ref} className="afb-section2" id="section-2">
          <hr className="afb-divider" />
          <div className="afb-header" style={{ animation:'fadeIn .6s' }}>
            <h1 style={{ fontSize:'1.9rem' }}>Now do this on real paper 📓</h1>
          </div>

          <div className="afb-paper-card">
            <p>The screen you just built digitally — now draw it in your notebook.</p>
            <p>Rough is perfect. Boxes for screens. Arrows between them. Labels on each box.</p>
            <p style={{ marginBottom:'.5rem' }}>This is not an art test. A 5-year-old's drawing is fine as long as it shows:</p>
            <ul className="afb-checklist">
              <li><span>✓</span> Which screens your app has</li>
              <li><span>✓</span> How a user moves between them</li>
            </ul>
            <p>Senior developers do this on whiteboards, napkins, the back of receipts. Your notebook is more than enough.</p>
            <p style={{ fontWeight:600, color:'#0f172a', marginBottom:'.5rem' }}>When you are done:</p>
            <p style={{ marginBottom:'.3rem' }}>1. Take a photo of your sketch</p>
            <p style={{ marginBottom:'.3rem' }}>2. Come back here</p>
            <p>3. Write one sentence describing your app flow</p>
          </div>

          <div style={{ marginBottom:'2rem' }}>
            <label style={{ display:'block', fontWeight:600, fontSize:'1.05rem', color:'#0f172a', marginBottom:'.6rem' }}>
              Your own words only — what does your sketch show?
            </label>
            <p style={{ color:'#64748b', fontSize:'.9rem', marginBottom:'.75rem', lineHeight:1.6 }}>
              How does a user go from opening your app to completing their main task?
            </p>
            <textarea
              id="flow-description"
              className="afb-textarea"
              placeholder={"My app starts at the Login screen, then the user goes to... and finally..."}
              value={flowText}
              onChange={e => setFlowText(e.target.value)}
              onPaste={e => e.preventDefault()}
              onContextMenu={e => e.preventDefault()}
            />
            <div id="sentence-counter" className={`afb-counter${sentenceCount >= 2 ? ' done' : ''}`}>
              {sentenceCount >= 2
                ? `✓ ${sentenceCount} sentences written — ready to submit`
                : `${sentenceCount} of 2 sentences written`}
            </div>
            <p style={{ fontSize:'.88rem', color:'#94a3b8', marginTop:'.75rem', fontStyle:'italic' }}>
              Your mentor will ask you to share your paper sketch photo in the next check-in. Keep it ready.
            </p>
          </div>

          <button id="submit-btn" className="afb-btn afb-btn-primary" style={{ maxWidth:480, margin:'0 auto' }}
            disabled={!canSubmit} onClick={handleSubmit}>
            My sketch is done — I'm ready to set up →
          </button>
        </div>
      )}

      {/* ══ DONE ══ */}
      {submitted && (
        <div className="afb-done-card" id="done-card" style={{ marginTop:'2rem' }}>
          <h2>Your wireframe is ready. 📱</h2>
          <p>You now know:</p>
          <ul className="afb-checklist-done">
            <li><span>✓</span> Your business and their problem</li>
            <li><span>✓</span> Your 3 MVP features</li>
            <li><span>✓</span> Your app's screens and flow</li>
          </ul>
          <p style={{ marginTop:'1rem' }}>
            One more thing before the coding starts —<br/>let's make sure your laptop is ready.
          </p>
          <p style={{ fontWeight:600, color:'#7c3aed', fontSize:'1.1rem', marginTop:'1rem' }}>
            Next: get your development environment set up.
          </p>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppFlowBuilder />);
  </script>

  <!-- Bootstrap: transform JSX and execute -->
  <script>
    (function() {
      var src = document.getElementById('jsx-source').textContent;
      try {
        var result = Babel.transform(src, {
          presets: [['react', { runtime: 'classic' }]]
        });
        var fn = new Function('React', 'ReactDOM', result.code);
        fn(React, ReactDOM);
      } catch(e) {
        document.getElementById('root').innerHTML =
          '<div style="color:red;padding:2rem;font-family:monospace;white-space:pre-wrap;">Error: ' + e.message + '</div>';
        console.error(e);
      }
    })();
  </script>
</body>
